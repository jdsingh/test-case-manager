name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Pages serves the site at /<repo-name>/.
      - run: bun run build --base-href "/${{ github.event.repository.name }}/"
      # Pages has no SPA fallback: serve the app for unknown paths so deep links work.
      - run: cp dist/test-case-manager/browser/index.html dist/test-case-manager/browser/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/test-case-manager/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
